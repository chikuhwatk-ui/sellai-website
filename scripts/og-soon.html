<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Noto+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#08301F;font-family:'Noto Sans',system-ui,sans-serif}
  .wrap{position:relative;width:1200px;height:630px;background:
    radial-gradient(60% 70% at 50% 40%, rgba(30,194,122,0.30), transparent 70%),
    linear-gradient(180deg,#0B3F2E 0%,#08301F 60%,#06261A 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring{position:absolute;left:50%;top:50%;border-radius:999px;border:1.5px solid rgba(30,194,122,0.35);transform:translate(-50%,-50%)}
  .brand{position:absolute;left:70px;top:56px;font-family:'Manrope';font-weight:800;font-size:34px;color:#3BD991;letter-spacing:-0.03em}
  .loc{position:absolute;right:70px;top:66px;font-size:15px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.6)}
  .eyebrow{font-size:16px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#3BD991;margin-bottom:22px}
  h1{margin:0;width:900px;font-family:'Manrope';font-weight:800;font-size:68px;line-height:1.05;letter-spacing:-0.03em;color:#fff}
  h1 span{color:#1EC27A}
  .sub{margin-top:26px;width:720px;font-size:22px;line-height:1.4;color:rgba(255,255,255,0.7)}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring" style="width:420px;height:420px;opacity:.8"></div>
  <div class="ring" style="width:760px;height:760px;opacity:.5"></div>
  <div class="ring" style="width:1100px;height:1100px;opacity:.25"></div>
  <div class="brand">Sellai</div>
  <div class="loc">Harare, Zimbabwe</div>
  <div class="eyebrow">Coming soon</div>
  <h1>Whatever you're looking for <span>is closer than you think.</span></h1>
  <div class="sub">Something new is coming to the way Harare buys and sells. Be the first to know.</div>
</div>
</body>
</html>
